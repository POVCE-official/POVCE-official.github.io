          "label": "横幅标题",
          "type": "string",
          "required": true
        },
        {
          "name": "bannerSubtitle",
          "label": "横幅文字",
          "type": "string",
          "required": true
        },
        {
          "name": "bannerDesktop",
          "label": "桌面横幅",
          "type": "image",
          "description": "留空使用 Shirone 默认横幅。"
        },
        {
          "name": "bannerMobile",
          "label": "手机横幅",
          "type": "image",
          "description": "留空使用 Shirone 默认横幅。"
        },
        {
          "name": "themeHue",
          "label": "主题色相",
          "type": "number",
          "required": true,
          "options": {
            "min": 0,
            "max": 360
          }
        },
        {
          "name": "name",
          "label": "显示名称",
          "type": "string",
